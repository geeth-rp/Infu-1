<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oviya Neha ✿</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #fff0f5 0%, #fce4ec 40%, #ffd6e7 100%);
      font-family: 'Nunito', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px;
      overflow-x: hidden;
    }

    /* Floating petals */
    .petal {
      position: fixed;
      pointer-events: none;
      opacity: 0;
      font-size: 22px;
      animation: falling linear infinite;
      z-index: 0;
    }
    @keyframes falling {
      0%   { transform: translateY(-60px) rotate(0deg); opacity: 0.7; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.80);
      backdrop-filter: blur(14px);
      border-radius: 32px;
      border: 2px solid rgba(255,182,213,0.55);
      padding: 36px 28px 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(220,100,140,0.13);
    }

    /* Avatar */
    .avatar-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 6px;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffb6d9 0%, #ff85b3 100%);
      border: 3.5px solid #fff;
      box-shadow: 0 0 0 3.5px #ffb6d9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
    }

    /* Name */
    .name {
      text-align: center;
      font-family: 'Pacifico', cursive;
      font-size: 2rem;
      color: #d6446b;
      margin: 14px 0 4px;
      letter-spacing: 0.5px;
    }
    .tagline {
      text-align: center;
      font-size: 0.93rem;
      color: #e07095;
      margin-bottom: 6px;
      font-weight: 600;
    }

    /* Divider petals */
    .divider {
      text-align: center;
      font-size: 18px;
      margin: 18px 0 20px;
      letter-spacing: 6px;
      color: #f4a8c4;
    }

    /* Link buttons */
    .links { display: flex; flex-direction: column; gap: 13px; }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      background: linear-gradient(90deg, #fff0f5 0%, #ffe4ef 100%);
      border: 1.5px solid rgba(255,150,190,0.45);
      border-radius: 18px;
      padding: 15px 20px;
      text-decoration: none;
      color: #c63061;
      font-weight: 700;
      font-size: 0.98rem;
      transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .link-btn:hover {
      background: linear-gradient(90deg, #ffe0ee 0%, #ffc8e2 100%);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 24px rgba(210,70,110,0.18);
    }
    .link-btn .icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .link-btn .label { flex: 1; }
    .link-btn .arrow { font-size: 16px; opacity: 0.5; }

    .icon-tiktok  { background: linear-gradient(135deg,#ff6fb0,#ff4488); }
    .icon-fb      { background: linear-gradient(135deg,#ffb3d1,#e87bb5); }
    .icon-email   { background: linear-gradient(135deg,#ffc6df,#ff85b3); }
    .icon-contact { background: linear-gradient(135deg,#ffd6e9,#ffaece); }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.82rem;
      color: #e094b4;
      font-weight: 600;
    }
    .footer span { font-size: 16px; }

    /* Cute floating hearts near name */
    .hearts {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 2px;
      font-size: 15px;
    }
  </style>
</head>
